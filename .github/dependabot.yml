version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: monthly }
    groups:
      site: { patterns: ['*'] }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    groups:
      dev-tools: { patterns: ['*'] }
